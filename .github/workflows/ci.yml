name: CI
on:
  pull_request:
    branches: ["main", "master"]
  push:
    branches: ["main", "master"]

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Lint code
        run: pnpm lint:code

      - name: Lint markdown
        run: pnpm lint:md

      - name: Validate docs frontmatter (strict)
        run: pnpm docs:validate

      - name: Validate backlog
        run: pnpm backlog:validate:ci

      - name: Report artifact (coverage)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
